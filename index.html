<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atria Wellness Club – Today's Classes</title>
  <style>
    :root {
      --bg:        #0D0D0D;
      --bg2:       #141414;
      --bg3:       #111111;
      --gold:      #C8A84B;
      --gold-dim:  rgba(200,168,75,0.12);
      --gold-line: rgba(200,168,75,0.35);
      --text:      #F2EEE6;
      --text-mid:  rgba(242,238,230,0.6);
      --text-dim:  rgba(242,238,230,0.35);
      --border:    rgba(242,238,230,0.08);
      --font: 'Century Gothic', 'Trebuchet MS', 'Gill Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 300;
      overflow: hidden;
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 28px;
      padding: 60px;
      text-align: center;
    }
    .screen img { width: 220px; filter: brightness(1.1); }
    .screen p {
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      max-width: 340px;
      line-height: 1.8;
    }
    .sep { width: 48px; height: 1px; background: var(--gold); opacity: 0.5; }
    .spinner {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main app ── */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 22px 48px 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header img {
      width: 160px;
      filter: brightness(1.1);
    }
    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .header-date {
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-mid);
    }
    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .live-dot {
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .header-spacer { width: 160px; }

    .header-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
      opacity: 0.35;
      flex-shrink: 0;
    }

    /* ── Horizontal class list ── */
    #classes-list {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Two panels crossfade */
    .list-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: row;
      overflow-x: hidden;
      transition: opacity 0.6s ease;
    }
    .list-panel.hidden { opacity: 0; pointer-events: none; }

    /* Day group — horizontal block */
    .day-group {
      display: flex;
      flex-direction: row;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    /* Vertical day label strip */
    .day-divider {
      width: 44px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      background: var(--bg3);
      border-right: 1px solid var(--border);
    }
    .day-divider-label {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    /* Cards wrapper */
    .cards-wrap {
      display: flex;
      flex-direction: row;
    }

    /* Individual class card */
    .class-card {
      width: 210px;
      padding: 24px 20px;
      border-right: 1px solid var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      height: 100%;
      animation: fadeIn 0.4s ease both;
    }
    .class-card.now { background: var(--gold-dim); }
    .class-card.now::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gold);
    }
    .class-card.future { opacity: 0.6; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Time section */
    .time-start {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--gold);
      line-height: 1.2;
    }
    .time-end { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

    .now-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(200,168,75,0.12);
      border: 1px solid rgba(200,168,75,0.25);
      border-radius: 2px;
      padding: 3px 8px;
    }
    .now-badge-dot {
      width: 5px; height: 5px;
      background: var(--gold);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Divider within card */
    .card-rule {
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Class info */
    .class-name {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.35;
    }
    .class-zone { font-size: 0.68rem; color: var(--text-dim); margin-top: 4px; }
    .class-zone span {
      display: inline-block;
      background: rgba(200,168,75,0.07);
      border: 1px solid rgba(200,168,75,0.18);
      border-radius: 2px;
      padding: 2px 7px;
      letter-spacing: 0.04em;
    }

    /* Instructor */
    .card-instructor-label {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .class-instructor {
      font-size: 0.85rem;
      color: var(--text-mid);
      line-height: 1.4;
      font-weight: 300;
    }

    /* Spots — pushed to bottom */
    .card-spots-wrap { margin-top: auto; }
    .spots-num { font-size: 1.4rem; font-weight: 500; line-height: 1; }
    .spots-num.open { color: #7BBF90; }
    .spots-num.low  { color: #C9A870; }
    .spots-num.full { color: #C97070; }
    .spots-lbl {
      font-size: 0.58rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 4px;
    }
    .spots-open-text {
      font-size: 0.72rem;
      color: #7BBF90;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .list-state {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      position: absolute;
      inset: 0;
      color: var(--text-dim);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    /* Footer */
    .footer {
      padding: 14px 48px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .footer-left {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .footer-right { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.06em; }
  </style>
</head>
<body>

  <div id="loading" class="screen">
    <img src="https://www.daisho-aus.com/wp-content/uploads/2025/07/logo-atria.png" alt="Atria Wellness Club">
    <div class="spinner"></div>
    <p>Loading today's schedule...</p>
  </div>

  <div id="error-screen" class="screen" style="display:none;">
    <img src="https://www.daisho-aus.com/wp-content/uploads/2025/07/logo-atria.png" alt="Atria Wellness Club">
    <div class="sep"></div>
    <p id="error-msg">Unable to connect. Please check configuration.</p>
  </div>

  <div id="app">
    <div class="header">
      <img src="https://www.daisho-aus.com/wp-content/uploads/2025/07/logo-atria.png" alt="Atria Wellness Club">
      <div class="header-center">
        <div class="header-date" id="header-date"></div>
        <div class="live"><span class="live-dot"></span>Live</div>
      </div>
      <div class="header-spacer"></div>
    </div>

    <div class="header-rule"></div>

    <div id="classes-list">
      <div id="panel-a" class="list-panel"></div>
      <div id="panel-b" class="list-panel hidden"></div>
    </div>

    <div class="footer">
      <div class="footer-left" id="footer-label">Today's Schedule &nbsp;·&nbsp; 180–192 Ann Street, Brisbane</div>
      <div class="footer-right" id="footer-time"></div>
    </div>
  </div>

  <script>
    const WORKER_URL          = 'https://atria-timetable-proxy.nitai-whitehurst.workers.dev';
    const REFRESH_MINS        = 5;
    const TICK_SECS           = 30;
    const LOW_SPOTS_THRESHOLD = 3;

    // HTML-encode API-derived strings before injecting into innerHTML
    const ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
    const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ESC[c]);

    // Return a Date at midnight Brisbane time (UTC+10, no DST) for the given moment
    function brisbaneMidnight(d) {
      const p = new Intl.DateTimeFormat('en', {
        timeZone: 'Australia/Brisbane',
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(d).reduce((acc, { type, value }) => ({ ...acc, [type]: value }), {});
      return new Date(`${p.year}-${p.month}-${p.day}T00:00:00+10:00`);
    }

    // Format a Date as a Brisbane-timezone ISO 8601 string for API queries
    function bne(d) {
      const p = new Intl.DateTimeFormat('en', {
        timeZone: 'Australia/Brisbane',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(d).reduce((acc, { type, value }) => ({ ...acc, [type]: value }), {});
      return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}+10:00`;
    }

    const fmt = iso => new Date(iso).toLocaleTimeString('en-AU', {
      timeZone: 'Australia/Brisbane', hour: '2-digit', minute: '2-digit', hour12: true
    });
    const fmtDate = d => d.toLocaleDateString('en-AU', {
      timeZone: 'Australia/Brisbane', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    const fmtDateShort = d => d.toLocaleDateString('en-AU', {
      timeZone: 'Australia/Brisbane', weekday: 'long', day: 'numeric', month: 'long'
    });

    function showError(msg) {
      document.getElementById('loading').style.display      = 'none';
      document.getElementById('app').style.display          = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').textContent      = msg || 'Unable to connect.';
    }

    function showApp() {
      document.getElementById('loading').style.display      = 'none';
      document.getElementById('error-screen').style.display = 'none';
      document.getElementById('app').style.display          = 'flex';
      document.getElementById('header-date').textContent    = fmtDate(new Date());
    }

    let cachedClasses = [];

    async function loadClasses() {
      const now = new Date();
      const todayStart = brisbaneMidnight(now);
      // Fetch a full week ahead so we always have enough days to fill the screen
      const weekEnd = new Date(now);
      weekEnd.setDate(weekEnd.getDate() + 7);
      weekEnd.setHours(23, 59, 59, 0);

      const params = new URLSearchParams({
        startDate: bne(todayStart),
        endDate:   bne(weekEnd),
      });

      try {
        const res = await fetch(`${WORKER_URL}?${params}`, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        const data = await res.json();

        cachedClasses = (data.value || []).filter(c =>
          c.classType &&
          c.isDeleted === false &&
          c.classType.isDeleted === false
        );
        cachedClasses.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

        renderClasses(now);
        document.getElementById('footer-time').textContent = `Updated ${fmt(now.toISOString())}`;
        showApp();
      } catch (e) {
        console.error('Load error:', e);
        if (document.getElementById('app').style.display === 'flex') {
          document.getElementById('footer-time').textContent = `Update failed — retrying`;
        } else {
          showError(`Unable to load schedule: ${e.message}`);
        }
      }
    }

    function tick() {
      if (document.getElementById('app').style.display === 'flex') {
        const now = new Date();
        renderClasses(now);
        document.getElementById('header-date').textContent = fmtDate(now);
      }
    }

    let activePanel = 'a';
    let firstLoad = true;

    // Card width + day label strip width — used to decide how many days fit
    const CARD_W    = 210;
    const DIVIDER_W = 44;

    function groupByDay(classes) {
      const map = new Map();
      for (const c of classes) {
        const midnight = brisbaneMidnight(new Date(c.startDate));
        const key = midnight.toISOString();
        if (!map.has(key)) map.set(key, { date: midnight, rows: [] });
        map.get(key).rows.push(c);
      }
      return Array.from(map.values()).sort((a, b) => a.date - b.date);
    }

    function renderClasses(now) {
      const screenW = window.innerWidth || 1920;

      // Drop classes that have already ended
      const visible = cachedClasses.filter(c => new Date(c.endDate) > now);

      if (!visible.length) {
        swapPanel('<div class="list-state"><span>No upcoming classes scheduled</span></div>');
        return;
      }

      const days = groupByDay(visible);

      let html = '';
      let usedW = 0;
      let daysUsed = 0;

      const today    = brisbaneMidnight(now);
      const tomorrow = new Date(today.getTime() + 86400000);

      for (const day of days) {
        const dayW = DIVIDER_W + day.rows.length * CARD_W;
        // Always show at least 1 day; keep adding while there's space
        if (daysUsed > 0 && usedW + dayW > screenW) break;

        const labelDate = day.date;

        let label;
        if (labelDate.getTime() === today.getTime())         label = `Today · ${fmtDateShort(labelDate)}`;
        else if (labelDate.getTime() === tomorrow.getTime()) label = `Tomorrow · ${fmtDateShort(labelDate)}`;
        else label = fmtDateShort(labelDate);

        const isFuture = labelDate > today;

        html += `<div class="day-group">
          <div class="day-divider">
            <span class="day-divider-label">${label}</span>
          </div>
          <div class="cards-wrap">
            ${day.rows.map((c, i) => renderCard(c, i, now, isFuture, firstLoad)).join('')}
          </div>
        </div>`;

        usedW += dayW;
        daysUsed++;
      }

      // Update footer label to reflect which days are shown
      const footerLabel = document.getElementById('footer-label');
      if (footerLabel) {
        const firstIsToday = days[0].date.getTime() === today.getTime();
        let title;
        if      (daysUsed === 1 && firstIsToday)  title = "Today's Schedule";
        else if (daysUsed >= 2 && firstIsToday)   title = 'Today & Tomorrow';
        else                                       title = 'Upcoming Schedule';
        footerLabel.innerHTML = `${title} &nbsp;·&nbsp; 180\u2013192 Ann Street, Brisbane`;
      }

      swapPanel(html);
    }

    function swapPanel(html) {
      const inPanel  = activePanel === 'a' ? 'panel-b' : 'panel-a';
      const outPanel = activePanel === 'a' ? 'panel-a' : 'panel-b';
      const inEl  = document.getElementById(inPanel);
      const outEl = document.getElementById(outPanel);
      inEl.innerHTML = html;
      inEl.classList.remove('hidden');
      outEl.classList.add('hidden');
      activePanel = activePanel === 'a' ? 'b' : 'a';
      firstLoad = false;
    }

    function renderCard(c, i, now, isFuture, animate) {
      const start = new Date(c.startDate);
      const end   = new Date(c.endDate);
      const isNow = !isFuture && now >= start && now < end;

      const limit = c.attendeesLimit || 0;
      const taken = c.attendeesCount || 0;
      const left  = Math.max(0, limit - taken);

      const instructor = escapeHtml(c.instructor
        ? `${c.instructor.firstName} ${c.instructor.lastName}`.trim()
        : '—');

      const name = escapeHtml(c.classType?.name || 'Class');
      const zone = c.clubZone?.name || c.clubZone?.shortName || null;
      const cardClass = isNow ? 'now' : isFuture ? 'future' : '';

      const timeSection = isNow
        ? `<div class="time-start">${fmt(c.startDate)}</div>
           <div class="now-badge"><span class="now-badge-dot"></span>In Progress</div>`
        : `<div class="time-start">${fmt(c.startDate)}</div>
           <div class="time-end">${fmt(c.endDate)}</div>`;

      let spotsHtml;
      if (limit === 0) {
        spotsHtml = `<div class="spots-open-text">Open</div>`;
      } else if (left === 0) {
        spotsHtml = `<div class="spots-num full">Full</div>`;
      } else {
        const spotsClass = left <= LOW_SPOTS_THRESHOLD ? 'low' : 'open';
        spotsHtml = `<div class="spots-num ${spotsClass}">${left}</div>
                     <div class="spots-lbl">spots</div>`;
      }

      return `
        <div class="class-card ${cardClass}" style="${animate ? `animation-delay:${i * 0.04}s` : 'animation:none'}">
          <div>${timeSection}</div>
          <div class="card-rule"></div>
          <div class="class-name">${name}</div>
          ${zone ? `<div class="class-zone"><span>${escapeHtml(zone)}</span></div>` : ''}
          <div>
            <div class="card-instructor-label">Instructor</div>
            <div class="class-instructor">${instructor}</div>
          </div>
          <div class="card-spots-wrap">${spotsHtml}</div>
        </div>`;
    }

    loadClasses();
    setInterval(loadClasses, REFRESH_MINS * 60 * 1000);
    setInterval(tick, TICK_SECS * 1000);
  </script>

</body>
</html>
